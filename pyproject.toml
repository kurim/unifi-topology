[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-topology"
version = "3.2.0"
description = "Python library for UniFi network topology discovery and SVG rendering"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merlijn Tishauser" }]
keywords = ["unifi", "network", "topology", "diagram", "svg"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Networking",
]
dependencies = [
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "dnspython>=2.7,<3",
  "Jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/merlijntishauser/unifi-topology"
Repository = "https://github.com/merlijntishauser/unifi-topology"
Issues = "https://github.com/merlijntishauser/unifi-topology/issues"
Changelog = "https://github.com/merlijntishauser/unifi-topology/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "Faker==40.39.0",
  "defusedxml==0.7.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pyright==1.1.414",
  "radon==6.0.1",
  "ruff==0.16.8",
  "xenon==0.9.3",
  "pip-audit==2.10.1",
]
docs = [
  "mkdocs-material==9.7.7",
  "mkdocstrings[python]==1.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["scripts/scrape_specs_playwright.py"]

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

# Xenon enforces cyclomatic complexity thresholds:
# A=1-5 (simple), B=6-10 (low), C=11-20 (moderate), D=21-30 (high), E=31-40 (very high), F=41+ (error-prone)
# Run: xenon src/unifi_topology --max-absolute A --max-modules A --max-average A
# For detailed analysis: radon cc src/unifi_topology -a -s

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["src/unifi_topology/assets"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests involving multiple components working together",
    "contract: API contract verification tests",
]

[tool.coverage.run]
branch = true
source = ["unifi_topology"]
omit = ["src/unifi_topology/model/mock.py"]

[tool.coverage.paths]
source = [
    "src/unifi_topology",
    "*/site-packages/unifi_topology",
]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"unifi_topology" = [
  "py.typed",
  "render/templates/*.j2",
  "assets/icons/*.svg",
  "assets/icons/isometric/*.svg",
  "assets/icons/isometric/ISOPACKS_LICENSE",
  "assets/icons/isometric/NOTICE",
  "assets/icons/icons-unifi/*.svg",
  "assets/icons/icons-unifi/LICENSE",
  "assets/icons/modern/*.svg",
  "assets/icons/modern-flat/*.svg",
  "assets/themes/*.yaml",
  "assets/fonts/*.woff2",
  "assets/fonts/*_LICENSE",
  "assets/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]
